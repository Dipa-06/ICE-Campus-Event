<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sign In - ICE Campus Events</title>

    <link rel="icon"
        type="image/png"
        href="logo.png">

    <link rel="stylesheet"
        href="style.css">

</head>


<body class="auth-body">


    <!-- =====================================
         SIGN IN BOX
    ====================================== -->

    <div class="auth-box">


        <!-- =====================================
             LOGO
        ====================================== -->

        <div class="auth-logo">

            <img src="logo.png"
                alt="ICE Logo">

            <span>
                ICE Campus Events
            </span>

        </div>



        <!-- =====================================
             HEADING
        ====================================== -->

        <h1>
            Welcome Back
        </h1>


        <p class="auth-subtitle">
            Sign in to discover campus events.
        </p>



        <!-- =====================================
             SIGN IN FORM
        ====================================== -->

        <form id="signinForm">


            <!-- EMAIL -->

            <label for="signinEmail">
                Email
            </label>


            <input
                type="email"
                id="signinEmail"
                placeholder="Enter your email"
                required
            >



            <!-- PASSWORD -->

            <label for="signinPassword">
                Password
            </label>


            <input
                type="password"
                id="signinPassword"
                placeholder="Enter your password"
                required
            >



            <!-- =====================================
                 REMEMBER ME + FORGOT PASSWORD
            ====================================== -->

            <div class="auth-options">


                <label class="remember">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>


                <a
                    href="#"
                    onclick="forgotPassword(event)">

                    Forgot Password?

                </a>


            </div>



            <!-- =====================================
                 SIGN IN BUTTON
            ====================================== -->

            <button
                type="submit"
                class="auth-button">

                Sign In

            </button>


        </form>



        <!-- =====================================
             SIGN UP LINK
        ====================================== -->

        <p class="auth-switch">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </p>



        <!-- =====================================
             BACK TO HOME
        ====================================== -->

        <a
            href="dashboard.html"
            class="back-home">

            ← Back to Home

        </a>


    </div>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>


</body>

</html>
