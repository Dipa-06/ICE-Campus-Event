<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sign Up - ICE Campus Events</title>

    <link rel="icon"
        type="image/png"
        href="logo.png">

    <link rel="stylesheet"
        href="style.css">

</head>


<body class="auth-body">


    <!-- =====================================
         SIGN UP BOX
    ====================================== -->

    <div class="auth-box">


        <!-- =====================================
             ICE LOGO
        ====================================== -->

        <div class="auth-logo">

            <img src="logo.png"
                alt="ICE Logo">

            <span>
                ICE Campus Events
            </span>

        </div>



        <!-- =====================================
             HEADING
        ====================================== -->

        <h1>
            Create Account
        </h1>


        <p class="auth-subtitle">
            Sign up to discover campus events.
        </p>



        <!-- =====================================
             SIGN UP FORM
        ====================================== -->

        <form id="signupForm">


            <!-- =====================================
                 FULL NAME
            ====================================== -->

            <label for="signupName">
                Full Name
            </label>


            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
                required
            >



            <!-- =====================================
                 STUDENT ID
            ====================================== -->

            <label for="studentId">
                Student ID
            </label>


            <input
                type="text"
                id="studentId"
                placeholder="Enter your student ID"
                required
            >



            <!-- =====================================
                 EMAIL
            ====================================== -->

            <label for="signupEmail">
                Email
            </label>


            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                required
            >



            <!-- =====================================
                 PASSWORD
            ====================================== -->

            <label for="signupPassword">
                Password
            </label>


            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                required
            >



            <!-- =====================================
                 CONFIRM PASSWORD
            ====================================== -->

            <label for="confirmPassword">
                Confirm Password
            </label>


            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >



            <!-- =====================================
                 TERMS AND CONDITIONS
            ====================================== -->

            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    I agree to the Terms & Conditions
                </span>

            </label>



            <!-- =====================================
                 SIGN UP BUTTON
            ====================================== -->

            <button
                type="submit"
                class="auth-button">

                Sign Up

            </button>


        </form>



        <!-- =====================================
             SIGN IN LINK
        ====================================== -->

        <p class="auth-switch">

            Already have an account?

            <a href="signin.html">
                Sign In
            </a>

        </p>



        <!-- =====================================
             BACK TO HOME
        ====================================== -->

        <a
            href="dashboard.html"
            class="back-home">

            ← Back to Home

        </a>


    </div>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>


</body>

</html>
